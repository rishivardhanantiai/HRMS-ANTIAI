{% extends "base.html" %}

{% block content %}

<h1 class="page-title">Settings</h1>
<p class="subtitle">Manage account settings</p>

<div class="card" style="max-width:420px;">

    <h3 style="margin-bottom:12px;">Change Password</h3>

    <form method="POST">
        <div class="password-field">
            <input type="password" name="old_password" id="old_password" placeholder="Old Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('old_password', this)">Show</button>
        </div>
        
        <div class="password-field">
            <input type="password" name="new_password" id="new_password" placeholder="New Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('new_password', this)">Show</button>
        </div>
        
        <div class="password-field">
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm New Password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)">Show</button>
        </div>

        <button type="submit" style="margin-top:10px; width:100%;">
            Update Password
        </button>
    </form>

    {% if message %}
        <div class="alert alert-{{ message_type }}" style="margin-top:15px;">
            {{ message }}
        </div>
    {% endif %}

    <hr style="margin:24px 0; border-color:#222;">

    <h3 style="margin-bottom:10px;">Session</h3>

    <a href="/logout" class="logout-btn">
        Logout
    </a>

</div>

<style>
.password-field {
    position: relative;
    margin-bottom: 12px;
}

.password-field input {
    width: 100%;
    padding-right: 64px;
    margin-bottom: 0;
    box-sizing: border-box;
}

.toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent !important;
    border: none !important;
    width: auto !important;
    height: auto !important;
    border-radius: 0 !important;
    cursor: pointer;
    padding: 0 !important;
    color: #38bdf8 !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: color 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.toggle-password:hover {
    background: transparent !important;
    color: #0284c7 !important;
}

.logout-btn{
    display:inline-block;
    padding:10px 18px;
    background:#ef4444;
    color:white;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
    width: 100%;
    text-align: center;
    box-sizing: border-box;
}
.logout-btn:hover{
    background:#dc2626;
}

.alert {
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
}

.alert-success {
    background: #1b5e20;
    color: #4caf50;
    border: 1px solid #2e7d32;
}

.alert-error {
    background: #5e1b1b;
    color: #ef5350;
    border: 1px solid #7d2e2e;
}
</style>

<script>
function togglePassword(fieldId, button) {
    const field = document.getElementById(fieldId);
    const isPassword = field.type === 'password';
    field.type = isPassword ? 'text' : 'password';
    if (button) {
        button.textContent = isPassword ? 'Hide' : 'Show';
    }
}
</script>

{% endblock %}
