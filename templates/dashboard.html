{% extends "base.html" %}

{% block content %}

<style>
.dashboard-center {
    max-width: 980px;
    margin: 0 auto;
}

.dashboard-title {
    font-size: clamp(30px, 5vw, 42px);
}

.dashboard-subtitle {
    margin-bottom: 28px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(220px, 1fr));
    gap: 20px;
}

.stat-card {
    min-width: 0;
}

@media (max-width: 768px) {
    .dashboard-center {
        padding: 0 4px;
    }

    .dashboard-subtitle {
        margin-bottom: 20px;
    }

    .stats {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .stat-card {
        padding: 22px 20px;
    }

    .stat-card p {
        font-size: 30px;
    }
}
</style>

<div class="dashboard-center">

    <h1 class="dashboard-title">Welcome to HRMS</h1>

    <p class="subtitle dashboard-subtitle">
        Overview of your hiring activity
    </p>

    <div class="stats">

        <div class="stat-card">
            <span>Total Jobs</span>
            <p>{{ total_jobs }}</p>
        </div>

        <div class="stat-card">
            <span>Total Applications</span>
            <p>{{ total_applications }}</p>
        </div>

        
    </div>

</div>

{% endblock %}
