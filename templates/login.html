<!DOCTYPE html>
<html>
<head>
    <title>{{ role }} Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="login-page">

    <!-- LOGO -->
    <div class="login-logo">
        <img src="/static/images/logo.png" alt="Logo">
    </div>

    <!-- LOGIN CARD -->
    <div class="card login-card">
        <h1 class="login-title">{{ role }} LOGIN</h1>

        <form method="POST">

            <!-- Email -->
            <input 
                type="email" 
                name="email" 
                placeholder="Email Address" 
                required
                autocomplete="off"
            >

            <!-- Password -->
            <input 
                type="password" 
                name="password" 
                placeholder="Password" 
                required
                autocomplete="off"
            >

            <!-- Submit -->
            <button type="submit">
                Login
            </button>

        </form>

        <!-- Back to Role Selection -->
        <div style="margin-top:15px; text-align:center;">
            <a href="/" style="font-size:13px; opacity:0.7; text-decoration:none;">
                ← Back to Role Selection
            </a>
        </div>

    </div>

</div>

</body>
</html>
