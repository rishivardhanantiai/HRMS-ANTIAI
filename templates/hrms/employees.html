{% extends "base.html" %}

{% block content %}

<style>

/* ===== WRAPPER ===== */
.hrms-wrapper{
    padding:35px 45px;
}

/* ===== HEADER ===== */
.hrms-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.hrms-title{
    font-size:24px;
    font-weight:600;
    color:#ffffff;
}

/* ===== CARD ===== */
.hrms-card{
    background:#020202;
    border-radius:20px;
    border:1px solid #111;
    box-shadow:0 0 40px rgba(0,0,0,0.9);
    padding:30px;
}

/* ===== TABLE ===== */
.hrms-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 12px;
}

.hrms-table thead th{
    color:#9ca3af;
    font-size:13px;
    font-weight:500;
    padding-bottom:12px;
}

.hrms-table tbody tr{
    background:#050505;
    border-radius:12px;
    transition:.3s ease;
}

.hrms-table tbody tr:hover{
    background:#0a0a0a;
    transform:scale(1.005);
}

.hrms-table td{
    padding:18px 14px;
    border:none;
    color:#e5e7eb;
}

/* ===== STATUS ===== */
.status-active{
    background:rgba(34,197,94,0.15);
    color:#22c55e;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
}

.status-inactive{
    background:rgba(239,68,68,0.15);
    color:#ef4444;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
}

/* ===== BUTTONS ===== */

.btn-add{
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    border:none;
    color:white;
    padding:9px 20px;
    border-radius:8px;
    font-weight:500;
    transition:.3s;
}

.btn-add:hover{
    opacity:.85;
}

/* ===== ACTION BUTTON GROUP ===== */
.action-group{
    display:flex;
    gap:8px;
    justify-content:flex-end;
}

/* ===== SMALL BUTTONS ===== */
.btn-action{
    padding:6px 12px;
    font-size:12px;
    border-radius:7px;
    border:none;
    transition:.3s;
}

/* EDIT */
.btn-edit{
    background:rgba(59,130,246,0.15);
    color:#3b82f6;
}

.btn-edit:hover{
    background:rgba(59,130,246,0.3);
}

/* TOGGLE */
.btn-toggle{
    background:rgba(234,179,8,0.15);
    color:#eab308;
}

.btn-toggle:hover{
    background:rgba(234,179,8,0.3);
}

/* DELETE */
.btn-delete{
    background:rgba(239,68,68,0.15);
    color:#ef4444;
}

.btn-delete:hover{
    background:rgba(239,68,68,0.3);
}

</style>

<div class="hrms-wrapper">

    <div class="hrms-header">
        <div class="hrms-title">Employees</div>

        <a href="/hrms/employees/add/ui" class="btn-add">
            + Add Employee
        </a>
    </div>

    <div class="hrms-card">

        <table class="hrms-table">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th style="text-align:right;">Actions</th>
                </tr>
            </thead>

            <tbody id="employees-table"></tbody>

        </table>

    </div>

</div>

<script>

async function loadEmployees(){

    const tbody=document.getElementById("employees-table");
    tbody.innerHTML="";

    const res=await fetch("/hrms/employees/list");
    const data=await res.json();

    if(!data.employees.length){
        tbody.innerHTML=`<tr>
        <td colspan="6" style="text-align:center; color:#888;">No employees found</td>
        </tr>`;
        return;
    }

    data.employees.forEach(emp=>{

        tbody.innerHTML+=`
        <tr>

            <td><strong>${emp.full_name}</strong></td>

            <td>${emp.email}</td>

            <td>${emp.department || "-"}</td>

            <td>${emp.role_name || "-"}</td>

            <td>
                <span class="${emp.status==="Active" ? "status-active" : "status-inactive"}">
                    ${emp.status}
                </span>
            </td>

            <td>

                <div class="action-group">

                    <a href="/hrms/employees/${emp.id}/edit"
                       class="btn-action btn-edit">
                       Edit
                    </a>

                    <button class="btn-action btn-toggle"
                        onclick="toggleStatus(${emp.id}, '${emp.status === 'Active' ? 'Inactive' : 'Active'}')">
                        Toggle
                    </button>

                    <button class="btn-action btn-delete"
                        onclick="deleteEmployee(${emp.id})">
                        Delete
                    </button>

                </div>

            </td>

        </tr>`;
    });
}

async function toggleStatus(id,status){

    await fetch(`/hrms/employees/${id}/status`,{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:`status=${status}`
    });

    loadEmployees();
}

async function deleteEmployee(id){

    if(!confirm("Are you sure you want to delete this employee?"))
        return;

    await fetch(`/hrms/employees/${id}/delete`, {
        method:"POST"
    });

    loadEmployees();
}

loadEmployees();

</script>

{% endblock %}
