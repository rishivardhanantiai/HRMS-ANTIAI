{% extends "base.html" %}
{% block content %}

<div class="dashboard-center">

    <h1>Welcome {{ session.get("employee_name") }} 👋</h1>
    <p class="subtitle">Your personal workspace</p>

    <div class="employee-stats">

        <div class="stat-card">
            <h3>📅 Attendance</h3>
            <p>View & manage your daily attendance</p>
            <a href="/hrms/attendance" class="btn-small">Go</a>
        </div>

        <div class="stat-card">
            <h3>💰 Payroll</h3>
            <p>Check your salary records</p>
            <a href="/hrms/my-payroll" class="btn-small">View</a>
        </div>

        <div class="stat-card">
            <h3>🏖 Leave</h3>
            <p>Apply & track leave requests</p>
            <a href="/hrms/leave" class="btn-small">Apply</a>
        </div>

    </div>

</div>

<style>
.employee-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    margin-top: 40px;
}

.stat-card {
    background: #111;
    padding: 25px;
    border-radius: 14px;
    border: 1px solid #222;
    transition: 0.3s;
}

.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.btn-small {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 12px;
    background: linear-gradient(45deg,#3b82f6,#6366f1);
    border-radius: 6px;
    color: white;
    text-decoration: none;
}
</style>

{% endblock %}
