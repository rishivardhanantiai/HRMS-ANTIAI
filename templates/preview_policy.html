<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Policy — {{ policy.title }}</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background: #0b0f19; color: #f1f5f9;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }
    .brand { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .brand .name { font-size: 20px; font-weight: 700; color: #fff; }
    
    .btn-back {
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 8px 16px;
        font-weight: 600;
        font-size: 13px;
        text-decoration: none;
        transition: all 0.2s;
    }
    .btn-back:hover {
        background: #334155;
        color: #fff;
    }

    .letter-paper {
        background: #fff; border-radius: 12px; padding: 44px 48px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        font-family: 'Times New Roman', Georgia, serif; font-size: 14.5px; line-height: 1.65; color: #111111;
        position: relative; text-align: justify;
    }
    .letter-header {
        display: flex; align-items: center; gap: 16px; margin-bottom: 6px; position: relative; z-index: 1;
    }
    .letter-header img { width: 90px; height: auto; }
    .letter-header .co-name { font-size: 22px; font-weight: 700; color: #111111; font-family: 'Times New Roman', Georgia, serif; }
    .letter-header .co-addr { font-size: 11.5px; font-weight: 700; color: #111111; margin-top: 3px; }
    .letter-header-rule { border: none; border-top: 2.5px solid #111; margin: 8px 0 20px; position: relative; z-index: 1; }
    .doc-title { text-align: center; font-size: 17px; font-weight: 700; text-decoration: underline; margin: 0 0 20px; position: relative; z-index: 1; }
    .letter-body { position: relative; z-index: 1; }
    .letter-body p { margin: 0 0 12px; }
</style>
</head>
<body>
<div class="wrap">
    <div class="brand">
        <div class="name">Template Preview</div>
        <a href="javascript:window.history.back();" class="btn-back">← Back</a>
    </div>

    <div class="letter-paper">
        <div class="letter-header">
            <img src="/static/images/logo_wordmark.png" alt="">
            <div>
                <div class="co-name">ANTI.AI PRIVATE LIMITED</div>
                <div class="co-addr">73, Rose Villa, Rajendra Nagar, Bharatpur</div>
            </div>
        </div>
        <hr class="letter-header-rule">
        <div class="doc-title">{{ policy.title | upper }}</div>
        <div class="letter-body">
            {{ policy.content_html | safe }}
        </div>
    </div>
</div>
</body>
</html>
